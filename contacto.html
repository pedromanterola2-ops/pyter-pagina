<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — Pytr | Desarrollo Web &amp; Software</title>
  <meta name="description" content="Cuéntame tu proyecto: te respondo en menos de 24 horas con una propuesta sin costo. Desarrollo web y software en Martínez de la Torre, Veracruz." />
  <meta name="theme-color" content="#08080d" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Contacto — Pytr" />
  <meta property="og:description" content="Cuéntame tu proyecto: propuesta sin costo en menos de 24 horas." />
  <meta property="og:locale" content="es_MX" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08080d;
      --bg2: #111119;
      --card: #111119;
      --border: rgba(255,255,255,0.12);
      --border-hover: rgba(139,92,246,0.5);
      --text: #ececf3;
      --muted: #9d9eb3; /* contraste AA sobre fondo oscuro */
      --accent: #8b5cf6;
      --accent2: #22d3ee;
      --green: #22c55e;
      --gradient: linear-gradient(120deg, #8b5cf6 0%, #22d3ee 100%);
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* ── ACCESIBILIDAD ── */
    .skip-link {
      position: absolute; top: -100px; left: 1rem;
      background: var(--accent); color: #fff;
      padding: 0.6rem 1.2rem; border-radius: 0 0 10px 10px;
      text-decoration: none; font-weight: 600; font-size: 0.9rem;
      z-index: 200;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
    }

    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      padding: 1.1rem 2.5rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(7,7,15,0.75);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }

    .logo {
      font-size: 1.6rem; font-weight: 900; letter-spacing: -1px;
      background: var(--gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .nav-back {
      display: flex; align-items: center; gap: 0.5rem;
      color: var(--muted); font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7rem 1.5rem 3rem;
    }

    .form-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
    }

    .form-label-top {
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.6rem;
    }

    .form-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .gradient-text {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-subtitle {
      color: var(--muted);
      font-size: 0.93rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Honeypot anti-spam: oculto para humanos, visible para bots */
    .hp-field {
      position: absolute;
      left: -9999px;
      width: 1px; height: 1px;
      overflow: hidden;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    .form-input, .form-textarea {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      transition: border-color 0.2s;
      outline: none;
      width: 100%;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent);
      background: rgba(139,92,246,0.06);
    }

    .form-input::placeholder, .form-textarea::placeholder {
      color: var(--muted);
    }

    .form-textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.6;
    }

    .form-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--gradient);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      margin-top: 0.4rem;
    }

    .form-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    .form-submit:active { transform: scale(0.98); }

    .form-success {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 0;
      text-align: center;
    }

    .form-success.visible { display: flex; }

    .form-success-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(34,197,94,0.15);
      border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      color: var(--green);
    }

    .form-success-text {
      font-size: 1rem;
      color: var(--text);
      font-weight: 500;
    }

    .form-success-sub {
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      nav { padding: 1rem 1.2rem; }
      .form-card { padding: 1.8rem 1.4rem; }
      .form-row { grid-template-columns: 1fr; }
      .form-title { font-size: 1.6rem; }
    }

    /* ── Estilo v2 ── */
    body { position: relative; overflow-x: hidden; }
    body::before { content: ''; position: fixed; width: 620px; height: 620px; top: -160px; left: -180px; border-radius: 50%; filter: blur(90px); background: radial-gradient(circle, rgba(139,92,246,.22), transparent 70%); pointer-events: none; z-index: -1; }
    body::after { display: none; }
    nav { top: 14px; left: 50%; transform: translateX(-50%); width: min(calc(100% - 2rem), 920px); padding: .6rem .7rem .6rem 1.25rem; border: 1px solid rgba(255,255,255,.08); border-radius: 999px; background: rgba(17,17,25,.75); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
    .logo { font-family: var(--display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.04em; background-clip: text; }
    .nav-back { padding: .5rem 1rem; border-radius: 999px; border: 1px solid var(--border); font-weight: 500; }
    .nav-back:hover { border-color: var(--accent); }
    .form-card { border-radius: 22px; padding: 2.75rem; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), 0 0 80px -30px rgba(139,92,246,.35); animation: cardIn .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } }
    .form-title { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 6vw, 2.8rem); letter-spacing: -0.035em; line-height: 1; margin-bottom: .8rem; }
    .form-subtitle { font-size: 1rem; }
    .form-group label { font-size: .88rem; color: var(--text); letter-spacing: 0; }
    .form-input, .form-textarea { border-radius: 12px; border-color: rgba(255,255,255,.1); font-size: .98rem; padding: .85rem 1rem; }
    .form-input:focus, .form-textarea:focus { box-shadow: 0 0 0 4px rgba(139,92,246,.15); }
    .form-submit { border-radius: 999px; padding: 1rem; font-size: 1rem; box-shadow: 0 8px 30px -8px rgba(139,92,246,.7); }
    .alt-wa { margin-top: 1.4rem; text-align: center; color: var(--muted); font-size: .92rem; }
    .alt-wa a { color: #25d366; font-weight: 600; text-decoration: none; }
    .alt-wa a:hover { text-decoration: underline; }
    footer { border-top: 0; }
    @media (prefers-reduced-motion: reduce) { .form-card { animation: none; } }
    @media (max-width: 480px) { .form-card { padding: 2rem 1.4rem; } }
  </style>
</head>
<body>

  <a href="#main" class="skip-link">Saltar al contenido</a>

  <nav aria-label="Navegación principal">
    <a href="index.html" class="logo" aria-label="Pytr — ir al inicio">Pytr</a>
    <a href="index.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
      Volver
    </a>
  </nav>

  <main id="main">
    <div class="form-card">
      <h1 class="form-title">Cuéntame tu proyecto</h1>
      <p class="form-subtitle">Te respondo en menos de 24 horas con una propuesta sin costo.</p>

      <form class="form-grid" method="POST" id="contactoForm">
        <input type="hidden" name="_subject" value="Nuevo mensaje desde tu página Pytr" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <p class="hp-field" aria-hidden="true">
          <label>No llenar este campo: <input name="_honey" tabindex="-1" autocomplete="off" /></label>
        </p>

        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input class="form-input" type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
          </div>
          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input class="form-input" type="tel" id="telefono" name="telefono" placeholder="Ej. 228 123 4567" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required />
        </div>

        <div class="form-group">
          <label for="mensaje">¿Qué necesitas?</label>
          <textarea class="form-textarea" id="mensaje" name="mensaje" placeholder="Cuéntame sobre tu proyecto, negocio o idea..." required></textarea>
        </div>

        <button class="form-submit" type="submit">Enviar mensaje</button>
      </form>

      <div class="form-success" id="formSuccess" role="status" tabindex="-1">
        <div class="form-success-icon" aria-hidden="true">✓</div>
        <div class="form-success-text">¡Mensaje enviado!</div>
        <div class="form-success-sub">Te respondo pronto a tu correo.</div>
      </div>
      <p class="alt-wa">¿Prefieres algo más rápido? <a href="https://wa.me/522282347278" target="_blank" rel="noopener noreferrer">Escríbeme por WhatsApp</a></p>
    </div>
  </main>

  <footer>© 2026 Pytr, Martínez de la Torre, Veracruz</footer>

  <script>
    const form = document.getElementById('contactoForm');
    const success = document.getElementById('formSuccess');

    // Envío vía FormSubmit (funciona en cualquier hosting, llega a tu correo)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        const res = await fetch('https://formsubmit.co/ajax/pedromanterola2@gmail.com', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: data
        });
        if (!res.ok) throw new Error('Error ' + res.status);
        form.style.display = 'none';
        success.classList.add('visible');
        success.focus();
      } catch (err) {
        alert('Hubo un error, intenta de nuevo o escríbeme por WhatsApp.');
      }
    });
  </script>

</body>
</html>
